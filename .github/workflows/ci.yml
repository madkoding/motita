name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # With no external dependencies there is nothing to cache: setup-go would warn
  # that go.sum does not exist. The project builds with the standard library only.
  GOFLAGS: -mod=mod

jobs:
  verify:
    name: fmt · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build web UI (Vite + Preact + Tailwind)
        run: cd web && npm ci && npm run build

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -count=1 -race ./...

      - name: The POSIX installer works end to end
        run: ./scripts/verify-install-sh.sh

      - name: The Windows installer works end to end
        # The ubuntu runner already ships PowerShell 7.6.6 (actions/runner-images), so the
        # Windows installer is exercised on the SAME runner as everything else instead of
        # needing a windows job. scripts/verify.sh runs the identical script locally.
        run: ./scripts/verify-install-ps1.sh

      - name: staticcheck
        run: |
          # Pinned: an unpinned @latest turns a green build red the day upstream adds a
          # check, with no change in this repository. Bump it deliberately.
          #
          # go run pkg@version resolves and builds the tool WITHOUT adding anything to
          # go.mod, so the zero-dependency property is untouched (no require line, no
          # go.sum). This is the step that would have caught the tautological assertions
          # go vet is happy with.
          go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...

      - name: the Go floor is still a supported release
        run: sh scripts/check-go-floor.sh

      # NOTE: staticcheck must run on the go.mod toolchain (setup-go provides exactly
      # that). No published version parses the export data of a much newer Go yet: under
      # 1.27 the same pin fails with "internal error in importing ... export data version
      # 4 is greater than maximum supported version 2", which reads like a finding and is
      # a tool that cannot read the compiler's output. Checked v0.6.0/v0.6.1/v0.7.0: all
      # pass on the floor, all fail on 1.27.

      - name: govulncheck
        run: |
          # Against the standard library and the module. With no external dependencies
          # the reachable surface is stdlib CVEs, which is still a real surface: this is
          # what says the pinned toolchain has no known vulnerability reachable from the
          # code. No go.mod change either.
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - name: coverage gate (100% per package)
        run: |
          # Every package with tests must be fully covered: the gate is what keeps
          # the suite honest, and it is checked package by package so a gap cannot
          # hide behind the aggregate.
          MIN_PER_PACKAGE=100.0
          failed=0
          for pkg in $(go list ./internal/... ./cmd/... ./tools/...); do
            # "does this package have tests" is asked of the package, not of go test's
            # report: the wording changed under Go 1.26 ("no test files" is gone), and a
            # string match on it silently stopped skipping the test-less harnesses and
            # started gating them at 0.0%.
            if [ "$(go list -f '{{len .TestGoFiles}}{{len .XTestGoFiles}}' "$pkg" 2>/dev/null)" = "00" ]; then
              echo "::warning::$pkg has no test files"
              continue
            fi
            # A TEST-SUPPORT package cannot meet this bar, and demanding it is asking for
            # tests of the tests: the only statements left uncovered are its own failure
            # and skip branches (t.Skip, t.Fatal, t.Errorf), which run when a test has
            # already failed. The exemption is derived from a property — does the package
            # import "testing" in non-test source? — rather than listed by name, so it
            # cannot be widened by adding a name and cannot go stale when a directory
            # moves. It matches exactly one package today: tools/clitest.
            if grep -rqs '"testing"' --include='*.go' $(go list -f '{{.Dir}}' "$pkg") 2>/dev/null \
               && [ -n "$(grep -l '"testing"' $(go list -f '{{.Dir}}' "$pkg")/*.go 2>/dev/null | grep -v '_test.go')" ]; then
              cov="$(go test -count=1 -cover "$pkg" 2>/dev/null | grep -oE 'coverage: [0-9.]+' | grep -oE '[0-9.]+' || echo 0)"
              printf '%-52s %s%% (test-support: its own failure branches)\n' "$pkg" "$cov"
              continue
            fi
            cov="$(go test -count=1 -cover "$pkg" 2>/dev/null | grep -oE 'coverage: [0-9.]+' | grep -oE '[0-9.]+' || echo 0)"
            printf '%-52s %s%%\n' "$pkg" "$cov"
            if awk -v c="$cov" -v m="$MIN_PER_PACKAGE" 'BEGIN { if (c < m) exit 1 }'; then
              :
            else
              echo "::error::$pkg coverage ${cov}% is below the ${MIN_PER_PACKAGE}% gate"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... >/dev/null
          printf 'aggregate: '; go tool cover -func=coverage.out | tail -1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform Go can build the binary for. windows/arm,
          # darwin/386 and darwin/arm do not exist in Go.
          - { goos: linux,   goarch: "386",   container: i386/debian:bookworm-slim,     platform: linux/386,   e2e: "true" }
          - { goos: linux,   goarch: amd64,   container: debian:bookworm-slim,         platform: linux/amd64, e2e: "true" }
          - { goos: linux,   goarch: arm,     container: arm32v7/debian:bookworm-slim, platform: linux/arm/v7, e2e: "true" }
          - { goos: linux,   goarch: arm64,   container: arm64v8/debian:bookworm-slim, platform: linux/arm64, e2e: "true" }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
      BINARY: dist/motita-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build web UI (Vite + Preact + Tailwind)
        run: cd web && npm ci && npm run build

      - name: Build static binary
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$BINARY" ./cmd/agent
          ls -l dist

      - name: Verify the binary really is for the platform its name claims
        run: |
          # A wrong cross-compile is invisible until the binary is run somewhere
          # else, so each container format is checked by its magic number:
          #   ELF    (linux)   7f 45 4c 46 + class in byte 5 (01 = 32-bit, 02 = 64-bit)
          #   PE     (windows) 4d 5a
          #   Mach-O (darwin)  cf fa ed fe (64-bit)
          for binary in "$BINARY"; do
            case "${{ matrix.goos }}" in
              windows)
                header="$(head -c 2 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "4d5a" ] || { echo "::error::$binary is not a PE executable ($header)"; exit 1; }
                echo "PE confirmed in $binary ($header)"
                ;;
              darwin)
                header="$(head -c 4 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "cffaedfe" ] || { echo "::error::$binary is not a 64-bit Mach-O ($header)"; exit 1; }
                echo "Mach-O confirmed in $binary ($header)"
                ;;
              linux)
                want="7f454c4602"
                case "${{ matrix.goarch }}" in 386|arm) want="7f454c4601" ;; esac
                header="$(head -c 5 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "$want" ] || { echo "::error::$binary has class $header, expected $want"; exit 1; }
                echo "ELF confirmed in $binary ($header)"
                ;;
            esac
            file "$binary" || true
            # Quality requirement: the final binary must weigh under 24 MB. The ceiling
            # was 10 MB while the project was a single CLI; features keep landing in this
            # same binary (the web interface, the gateway's WebSocket transport, scheduled
            # tasks), so the ceiling is a guard against RUNAWAY growth - a dependency that
            # drags a framework in - and not a budget any single feature has to argue with.
            bytes="$(stat -c%s "$binary")"
            [ "$bytes" -lt 25165824 ] || { echo "::error::$binary weighs $bytes bytes (limit: 24 MB)"; exit 1; }
            echo "$binary: $bytes bytes (< 24 MB)"
          done

      - name: Register qemu (only needed outside the native architectures)
        # Without this the arm containers cannot execute anything on an amd64
        # runner and the failure reads as a broken binary ("exec format error").
        # The action runs its binfmt image --privileged, in the job that builds the
        # release binaries, so the image is pinned by digest as well as the action
        # by commit: a moved tag cannot change what runs with that privilege.
        if: matrix.goos == 'linux' && (matrix.goarch == 'arm' || matrix.goarch == 'arm64')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm,arm64

      - name: Run the binaries in their own container (smoke test)
        if: matrix.goos == 'linux'
        run: |
          chmod +x dist/*
          # The real artifact name is used (BINARY includes goos-goarch), never a
          # hand-written one.
          docker run --rm -v "$PWD/dist:/t:ro" --platform "${{ matrix.platform }}" \
            "${{ matrix.container }}" sh -c "/t/$(basename "$BINARY") -version"

      - name: Configuration validation (without calling the LLM)
        if: matrix.goos == 'linux'
        run: |
          docker run --rm -v "$PWD/dist:/t:ro" -v "$PWD/configs:/c:ro" --platform "${{ matrix.platform }}" \
            "${{ matrix.container }}" sh -c \
            "MOTITA_LLM_API_KEY=test MOTITA_SANDBOX_CGROUPS=off /t/$(basename "$BINARY") -config /c/agent.yaml.example -validate-config"

      - name: End-to-end test
        if: matrix.e2e == 'true'
        run: |
          chmod +x scripts/e2e-agent.sh scripts/e2e.sh
          ./scripts/e2e-agent.sh "${{ matrix.goarch }}"
          ./scripts/e2e.sh "${{ matrix.goarch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motita-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.BINARY }}
          if-no-files-found: error

  gateway:
    name: gateway over HTTP
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build web UI (Vite + Preact + Tailwind)
        run: cd web && npm ci && npm run build

      # One job, not a nine-platform matrix: the gateway is a single HTTP surface, and its
      # behaviour does not vary with the target architecture the way a sandbox or a signal
      # handler does. The other e2e scripts already run per platform.
      - name: End-to-end test of the gateway
        run: ./scripts/e2e-gateway.sh amd64

      # The size ceiling guards against RUNAWAY growth rather than capping features: the
      # gateway is hand-written on the standard library, and a dependency added here would
      # land in the same binary this gate measures.
      - name: The binary still fits under the ceiling
        run: |
          bytes="$(stat -c%s dist/.e2e/motita-gateway-linux-amd64)"
          echo "the gateway build weighs $bytes bytes"
          [ "$bytes" -lt 25165824 ] || { echo "::error::the binary weighs $bytes bytes (limit: 24 MB)"; exit 1; }

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    # id-token and attestations are granted here only: they are what the provenance
    # attestation below needs, and no other job signs anything.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums of the published binaries
        working-directory: dist
        run: |
          # Deterministic order and only the binaries, so the file is stable.
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the checksums
        # SHA256SUMS.sig is a raw ed25519 signature over SHA256SUMS, made with the
        # RELEASE_SIGNING_KEY secret (a PEM private key; `make release-key` creates
        # the pair). The updater and the installers verify it against the public key
        # embedded in them. Once a public key is embedded a missing secret fails
        # here instead of shipping something users would refuse; until then the
        # step only warns, so releases keep shipping while the key is set up.
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          pub="$(sed -n 's/^const ReleasePublicKey = "\(.*\)"$/\1/p' ../internal/updater/updater.go)"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            if [ -n "$pub" ]; then
              echo "::error::the RELEASE_SIGNING_KEY secret is not set; run 'make release-key' and store the private key as that secret"
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set and no public key is embedded yet; this release is not signed"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          # Check it against the key the binaries embed, when one is embedded: a
          # secret that does not match would publish a release every client refuses.
          if [ -n "$pub" ]; then
            printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$pub" > "$RUNNER_TEMP/release.pub"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          else
            echo "::warning::ReleasePublicKey is still the empty placeholder; clients will not check this signature yet"
          fi

      - name: Build provenance for the binaries
        # Verifiable with: gh attestation verify <binary> --repo madkoding/motita
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/motita-*

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true
