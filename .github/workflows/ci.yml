name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request makes the run for its previous commit worthless, so that run
# is cancelled. main and tags are never cancelled: every commit there gets its full run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The project builds with the standard library only, so there is no go.sum and setup-go's
  # own cache (keyed on go.sum) is off. The Go BUILD cache is still worth keeping: compiling
  # the standard library with -race, the cross-compiled targets and staticcheck itself is
  # most of the time of a cold job. Each job restores it with actions/cache (see GO_CACHE_*
  # below), keyed per job and target so a windows build never restores a race build.
  GOFLAGS: -mod=mod

jobs:
  # The web UI is built ONCE and every job that embeds it downloads the same assets: twelve
  # identical `npm ci && npm run build` runs became one, and every binary of a run embeds the
  # exact bundle the web tests ran against.
  web:
    name: web UI · build · test · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node 22 runs the web tests' TypeScript imports as they are (type stripping). The npm
      # download cache is keyed on the lockfile; `npm ci` still installs from the lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web UI (Vite + Preact + Tailwind)
        run: cd web && npm ci && npm run build

      # The same 100 % bar as the Go packages, lines and branches, file by file: a file no test
      # loads fails as surely as one at 0 %.
      - name: Web UI tests · coverage gate (100% per file)
        run: cd web && npm run test:coverage && node scripts/coverage-gate.mjs

      - name: Web UI type check
        run: cd web && npm run typecheck

      # One tar instead of ~1400 loose files: the emoji set alone is 1285 of them, and an
      # artifact uploads and downloads file by file.
      - name: Pack the embedded assets
        run: tar -C internal/webui -cf webui-assets.tar assets

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: webui-assets
          path: webui-assets.tar
          retention-days: 1
          if-no-files-found: error

  lint:
    name: fmt · vet · staticcheck · govulncheck
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-lint
          cache-paths: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: no Go file imports unsafe
        run: |
          # The sandbox hands the kernel addresses of anonymous mappings (kernelBuffer) instead,
          # so nothing needs the unsafe package; Semgrep flags it and Sonar ignores nosemgrep.
          if grep -rn --include='*.go' -E '^\s*(import\s+)?"unsafe"' .; then
            echo "::error::the unsafe package is not allowed; see kernelBuffer in internal/sandbox" >&2
            exit 1
          fi

      - name: The POSIX installer works end to end
        run: ./scripts/verify-install-sh.sh

      - name: The Windows installer works end to end
        # The ubuntu runner already ships PowerShell 7.6.6 (actions/runner-images), so the
        # Windows installer is exercised on the SAME runner as everything else instead of
        # needing a windows job. scripts/verify.sh runs the identical script locally.
        run: ./scripts/verify-install-ps1.sh

      - name: staticcheck
        run: |
          # Pinned: an unpinned @latest turns a green build red the day upstream adds a
          # check, with no change in this repository. Bump it deliberately.
          #
          # go run pkg@version resolves and builds the tool WITHOUT adding anything to
          # go.mod, so the zero-dependency property is untouched (no require line, no
          # go.sum). This is the step that would have caught the tautological assertions
          # go vet is happy with.
          go run honnef.co/go/tools/cmd/staticcheck@v0.6.1 ./...

      - name: the Go floor is still a supported release
        run: sh scripts/check-go-floor.sh

      # NOTE: staticcheck must run on the go.mod toolchain (setup-go provides exactly
      # that). No published version parses the export data of a much newer Go yet: under
      # 1.27 the same pin fails with "internal error in importing ... export data version
      # 4 is greater than maximum supported version 2", which reads like a finding and is
      # a tool that cannot read the compiler's output. Checked v0.6.0/v0.6.1/v0.7.0: all
      # pass on the floor, all fail on 1.27.

      - name: govulncheck
        run: |
          # Against the standard library and the module. With no external dependencies
          # the reachable surface is stdlib CVEs, which is still a real surface: this is
          # what says the pinned toolchain has no known vulnerability reachable from the
          # code. No go.mod change either.
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-lint
          cache-paths: |
            ~/.cache/go-build
            ~/.cache/staticcheck
            ~/go/pkg/mod

  test:
    name: go test -race · coverage gate (100% per package)
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-test

      # One run gives both answers: the race detector and each package's own coverage.
      # Coverage instrumentation does not change what a test does, and the per-package figure
      # `go test -cover ./...` prints is the same one `go test -cover <pkg>` printed when the
      # gate below ran every package again, one at a time, after this step.
      - name: go test (with race detector and per-package coverage)
        run: |
          set -o pipefail
          go test -count=1 -race -cover ./... 2>&1 | tee test.log

      - name: coverage gate (100% per package)
        run: |
          # Every package with tests must be fully covered: the gate is what keeps
          # the suite honest, and it is checked package by package so a gap cannot
          # hide behind the aggregate. The figures come from the run above (test.log).
          MIN_PER_PACKAGE=100.0
          failed=0
          coverage_of() {
            awk -v p="$1" '$1 == "ok" && $2 == p {
              for (i = 3; i < NF; i++) if ($i == "coverage:") { sub("%", "", $(i + 1)); print $(i + 1); exit }
            }' test.log
          }
          for pkg in $(go list ./internal/... ./cmd/... ./tools/...); do
            # "does this package have tests" is asked of the package, not of go test's
            # report: the wording changed under Go 1.26 ("no test files" is gone), and a
            # string match on it silently stopped skipping the test-less harnesses and
            # started gating them at 0.0%.
            if [ "$(go list -f '{{len .TestGoFiles}}{{len .XTestGoFiles}}' "$pkg" 2>/dev/null)" = "00" ]; then
              echo "::warning::$pkg has no test files"
              continue
            fi
            cov="$(coverage_of "$pkg")"
            cov="${cov:-0}"
            # A TEST-SUPPORT package cannot meet this bar, and demanding it is asking for
            # tests of the tests: the only statements left uncovered are its own failure
            # and skip branches (t.Skip, t.Fatal, t.Errorf), which run when a test has
            # already failed. The exemption is derived from a property — does the package
            # import "testing" in non-test source? — rather than listed by name, so it
            # cannot be widened by adding a name and cannot go stale when a directory
            # moves. It matches exactly one package today: tools/clitest.
            if grep -rqs '"testing"' --include='*.go' $(go list -f '{{.Dir}}' "$pkg") 2>/dev/null \
               && [ -n "$(grep -l '"testing"' $(go list -f '{{.Dir}}' "$pkg")/*.go 2>/dev/null | grep -v '_test.go')" ]; then
              printf '%-52s %s%% (test-support: its own failure branches)\n' "$pkg" "$cov"
              continue
            fi
            printf '%-52s %s%%\n' "$pkg" "$cov"
            if awk -v c="$cov" -v m="$MIN_PER_PACKAGE" 'BEGIN { if (c < m) exit 1 }'; then
              :
            else
              echo "::error::$pkg coverage ${cov}% is below the ${MIN_PER_PACKAGE}% gate"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-test

  # The cross-package figure (-coverpkg=./...) needs a run of its own: with -coverpkg every
  # package reports the coverage of ALL packages, so it cannot share the gate's run. It runs
  # beside the race run instead of after it.
  coverage:
    name: aggregate coverage
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-coverage

      - name: aggregate coverage
        run: |
          # The output is kept rather than thrown away: when this run fails, the log has to name
          # the test that failed, not just the exit code.
          if ! go test -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... >aggregate.log 2>&1; then
            grep -E -B2 -A20 '^(--- FAIL|FAIL|panic:)' aggregate.log || tail -n 100 aggregate.log
            exit 1
          fi
          printf 'aggregate: '; go tool cover -func=coverage.out | tail -1

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-coverage

  # The Windows side of the agent: the shell it runs lines through (PowerShell), the policy that
  # judges those lines and the procedures served there. The Linux jobs cover the same code, but
  # only a Windows machine has Windows PowerShell, Windows paths and Windows process creation.
  windows:
    name: windows · PowerShell, policy and procedures
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: the shell runs a line under PowerShell
        run: go test -count=1 -run 'Shell|PowerShell|Quote|IsCmd' ./internal/execx/

      - name: the policy judges PowerShell lines and Windows paths
        run: go test -count=1 -run 'PowerShell|WindowsPath|WindowsRequest' ./internal/policy/

      - name: the Windows procedures are served
        run: go test -count=1 -run 'Variant|Windows' ./internal/skills/

      - name: the folder browser reaches Windows drives
        run: go test -count=1 -run 'OnWindowsDrives|WindowsSystemFolders' ./internal/gateway/

      - name: the desktop steps parse and run under Windows PowerShell
        run: go test -count=1 -run 'WindowsScripts' ./internal/desktop/

  # The name branch protection requires. The checks it stood for are now three jobs that run
  # in parallel, so this job carries the old name and passes only when all three passed.
  # `always()` plus the explicit check matter: a required job that is SKIPPED counts as
  # passing, so a plain `needs:` would let a red lint or test merge.
  verify:
    name: fmt · vet · test
    if: always()
    needs: [lint, test, coverage, windows]
    runs-on: ubuntu-latest
    steps:
      - name: lint, test, coverage and windows all passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::a required job ended as $r"; exit 1; }
          done

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    # Only the web assets: the binaries are built while the tests run, not after them.
    needs: web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every platform Go can build the binary for. windows/arm,
          # darwin/386 and darwin/arm do not exist in Go.
          - {
              goos: linux,
              goarch: "386",
              container: i386/debian:bookworm-slim,
              platform: linux/386,
              e2e: "true",
            }
          - {
              goos: linux,
              goarch: amd64,
              container: debian:bookworm-slim,
              platform: linux/amd64,
              e2e: "true",
            }
          - {
              goos: linux,
              goarch: arm,
              container: arm32v7/debian:bookworm-slim,
              platform: linux/arm/v7,
              e2e: "true",
            }
          - {
              goos: linux,
              goarch: arm64,
              container: arm64v8/debian:bookworm-slim,
              platform: linux/arm64,
              e2e: "true",
            }
          # Termux. Android kills a GOOS=linux binary with SIGSYS (its seccomp policy
          # blocks faccessat2, which the linux runtime calls), so it needs its own build.
          # arm64 is the one android target Go links without cgo. termux-docker is a real
          # Android userland (bionic, /system/bin/sh), so the smoke test proves the build
          # loads and runs there.
          - {
              goos: android,
              goarch: arm64,
              container: termux/termux-docker:aarch64,
              platform: linux/arm64,
            }
          - { goos: windows, goarch: "386" }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      EXT: ${{ matrix.goos == 'windows' && '.exe' || '' }}
      BINARY: dist/motita-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-build-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Build static binary
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$BINARY" ./cmd/agent
          ls -l dist

      - name: Verify the binary really is for the platform its name claims
        run: |
          # A wrong cross-compile is invisible until the binary is run somewhere
          # else, so each container format is checked by its magic number:
          #   ELF    (linux, android) 7f 45 4c 46 + class in byte 5 (01 = 32-bit, 02 = 64-bit)
          #   PE     (windows) 4d 5a
          #   Mach-O (darwin)  cf fa ed fe (64-bit)
          for binary in "$BINARY"; do
            case "${{ matrix.goos }}" in
              windows)
                header="$(head -c 2 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "4d5a" ] || { echo "::error::$binary is not a PE executable ($header)"; exit 1; }
                echo "PE confirmed in $binary ($header)"
                ;;
              darwin)
                header="$(head -c 4 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "cffaedfe" ] || { echo "::error::$binary is not a 64-bit Mach-O ($header)"; exit 1; }
                echo "Mach-O confirmed in $binary ($header)"
                ;;
              linux|android)
                want="7f454c4602"
                case "${{ matrix.goarch }}" in 386|arm) want="7f454c4601" ;; esac
                header="$(head -c 5 "$binary" | od -An -tx1 | tr -d ' \n')"
                [ "$header" = "$want" ] || { echo "::error::$binary has class $header, expected $want"; exit 1; }
                echo "ELF confirmed in $binary ($header)"
                ;;
            esac
            file "$binary" || true
            # Quality requirement: the final binary must weigh under 24 MB. The ceiling
            # was 10 MB while the project was a single CLI; features keep landing in this
            # same binary (the web interface, the gateway's WebSocket transport, scheduled
            # tasks), so the ceiling is a guard against RUNAWAY growth - a dependency that
            # drags a framework in - and not a budget any single feature has to argue with.
            bytes="$(stat -c%s "$binary")"
            [ "$bytes" -lt 25165824 ] || { echo "::error::$binary weighs $bytes bytes (limit: 24 MB)"; exit 1; }
            echo "$binary: $bytes bytes (< 24 MB)"
          done

      - name: Register qemu (only needed outside the native architectures)
        # Without this the arm containers cannot execute anything on an amd64
        # runner and the failure reads as a broken binary ("exec format error").
        # The action runs its binfmt image --privileged, in the job that builds the
        # release binaries, so the image is pinned by digest as well as the action
        # by commit: a moved tag cannot change what runs with that privilege.
        if: matrix.platform == 'linux/arm/v7' || matrix.platform == 'linux/arm64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm,arm64

      - name: Run the binaries in their own container (smoke test)
        if: matrix.container != ''
        run: |
          chmod +x dist/*
          # The real artifact name is used (BINARY includes goos-goarch), never a
          # hand-written one.
          docker run --rm -v "$PWD/dist:/t:ro" --platform "${{ matrix.platform }}" \
            "${{ matrix.container }}" sh -c "/t/$(basename "$BINARY") -version"

      - name: Configuration validation (without calling the LLM)
        if: matrix.container != ''
        run: |
          docker run --rm -v "$PWD/dist:/t:ro" -v "$PWD/configs:/c:ro" --platform "${{ matrix.platform }}" \
            "${{ matrix.container }}" sh -c \
            "MOTITA_LLM_API_KEY=test MOTITA_SANDBOX_CGROUPS=off /t/$(basename "$BINARY") -config /c/agent.yaml.example -validate-config"

      - name: End-to-end test
        if: matrix.e2e == 'true'
        run: |
          chmod +x scripts/e2e-agent.sh scripts/e2e.sh
          ./scripts/e2e-agent.sh "${{ matrix.goarch }}"
          ./scripts/e2e.sh "${{ matrix.goarch }}"

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-build-${{ matrix.goos }}-${{ matrix.goarch }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: motita-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.BINARY }}
          if-no-files-found: error

  android-seccomp:
    name: android build under Android's seccomp rule
    # Native arm64: qemu-user refuses seccomp filters, so the trap cannot be emulated.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-android-seccomp
          web-assets: "false"

      # Termux crashed with SIGSYS on faccessat2. The linux build must still die under the
      # trap (the control) and the android build must reach the setup wizard.
      - name: The android build survives the faccessat2 trap
        run: ./scripts/verify-android-seccomp.sh

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-android-seccomp

  gateway:
    name: gateway over HTTP
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/go-env
        with:
          cache-key: go-gateway

      # One job, not a nine-platform matrix: the gateway is a single HTTP surface, and its
      # behaviour does not vary with the target architecture the way a sandbox or a signal
      # handler does. The other e2e scripts already run per platform.
      - name: End-to-end test of the gateway
        run: ./scripts/e2e-gateway.sh amd64

      # The suggestions flow over HTTP: proposed, answered once, applied, kept across a restart.
      - name: End-to-end test of the suggestions flow
        run: ./scripts/e2e-suggestions.sh

      # The size ceiling guards against RUNAWAY growth rather than capping features: the
      # gateway is hand-written on the standard library, and a dependency added here would
      # land in the same binary this gate measures.
      - name: The binary still fits under the ceiling
        run: |
          bytes="$(stat -c%s dist/.e2e/motita-gateway-linux-amd64)"
          echo "the gateway build weighs $bytes bytes"
          [ "$bytes" -lt 25165824 ] || { echo "::error::the binary weighs $bytes bytes (limit: 24 MB)"; exit 1; }

      - uses: ./.github/actions/go-cache-save
        with:
          cache-key: go-gateway


  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, coverage, windows, build, android-seccomp, gateway]
    runs-on: ubuntu-latest
    # id-token and attestations are granted here only: they are what the provenance
    # attestation below needs, and no other job signs anything.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Only the binaries: the run also carries the web assets (webui-assets).
          pattern: motita-*
          path: dist
          merge-multiple: true

      - name: Checksums of the published binaries
        working-directory: dist
        run: |
          # Deterministic order and only the binaries, so the file is stable.
          sha256sum * | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Sign the checksums
        # SHA256SUMS.sig is a raw ed25519 signature over SHA256SUMS, made with the
        # RELEASE_SIGNING_KEY secret (a PEM private key; `make release-key` creates
        # the pair). The updater and the installers verify it against the public key
        # embedded in them. Once a public key is embedded a missing secret fails
        # here instead of shipping something users would refuse; until then the
        # step only warns, so releases keep shipping while the key is set up.
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -eu
          pub="$(sed -n 's/^const ReleasePublicKey = "\(.*\)"$/\1/p' ../internal/updater/updater.go)"
          if [ -z "${RELEASE_SIGNING_KEY:-}" ]; then
            if [ -n "$pub" ]; then
              echo "::error::the RELEASE_SIGNING_KEY secret is not set; run 'make release-key' and store the private key as that secret"
              exit 1
            fi
            echo "::warning::RELEASE_SIGNING_KEY is not set and no public key is embedded yet; this release is not signed"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/release-signing-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.sig
          # Check it against the key the binaries embed, when one is embedded: a
          # secret that does not match would publish a release every client refuses.
          if [ -n "$pub" ]; then
            printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$pub" > "$RUNNER_TEMP/release.pub"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/release.pub" -rawin -in SHA256SUMS -sigfile SHA256SUMS.sig
          else
            echo "::warning::ReleasePublicKey is still the empty placeholder; clients will not check this signature yet"
          fi

      - name: Build provenance for the binaries
        # Verifiable with: gh attestation verify <binary> --repo madkoding/motita
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/motita-*

      # semantic-release created this tag's release as a draft. This step finds it
      # by tag, uploads the files and then publishes it (no `draft: true` here), so
      # the release turns public only with every binary already attached.
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*
          generate_release_notes: true

  # The site advertises the version, so it publishes only once that version's
  # binaries are on the release: after `release`, never in parallel with the build.
  pages:
    name: publish site
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  # The Vercel mirror (motita.kodingvibes.com) builds on every push to main, but
  # a merge deploys before its tag exists, so it would stamp the previous release.
  # Its deploy hook rebuilds main once this release is published, the same moment
  # Pages publishes. Without the secret this is a notice, not a failure: the page
  # still fetches releases/latest in the browser.
  vercel:
    name: refresh vercel mirror
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Trigger the Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "::notice::VERCEL_DEPLOY_HOOK is not set; the Vercel mirror keeps the version of its last build"
            exit 0
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" >/dev/null
          echo "Vercel redeploy requested"
