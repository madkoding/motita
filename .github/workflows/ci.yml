name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Sin dependencias externas no hay nada que cachear: setup-go avisaría de que
  # no existe go.sum. El proyecto compila sólo con la biblioteca estándar.
  GOFLAGS: -mod=mod

jobs:
  verificar:
    name: fmt · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          sin_formato="$(gofmt -l .)"
          if [ -n "$sin_formato" ]; then
            echo "Archivos sin formatear:"
            echo "$sin_formato"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 -race ./...

  compilar:
    name: compilar ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verificar
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386", verificar32: "true" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      AGENTE: dist/starlight-agent-${{ matrix.goos }}-${{ matrix.goarch }}
      CHAT: dist/starlight-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Compilar binarios estáticos (agente + chat)
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$AGENTE" ./cmd/agent
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$CHAT" ./cmd/chat
          ls -l dist

      - name: Verificar que los binarios son de 32 bits y cumplen el límite de tamaño
        if: matrix.verificar32 == 'true'
        run: |
          for binario in "$AGENTE" "$CHAT"; do
            file "$binario"
            file "$binario" | grep -q "ELF 32-bit" || { echo "::error::$binario no es de 32 bits"; exit 1; }
            # Comprobación independiente de `file`: byte 5 de la cabecera ELF
            # (0x01 = ELFCLASS32).
            clase="$(head -c 5 "$binario" | od -An -tx1 | tr -d ' \n')"
            [ "$clase" = "7f454c4601" ] || { echo "::error::cabecera ELF inesperada en $binario: $clase"; exit 1; }
            echo "ELFCLASS32 confirmado en $binario ($clase)"
            # Requisito de calidad: el binario final debe pesar menos de 10 MB.
            bytes="$(stat -c%s "$binario")"
            [ "$bytes" -lt 10485760 ] || { echo "::error::$binario pesa $bytes bytes (límite: 10 MB)"; exit 1; }
            echo "$binario: $bytes bytes (< 10 MB)"
          done

      - name: Ejecutar los binarios en un contenedor i386 (prueba de humo)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          chmod +x "$AGENTE" "$CHAT"
          docker run --rm -v "$PWD/dist:/t:ro" --platform linux/386 \
            i386/debian:bookworm-slim sh -c '/t/starlight-agent-386 -version; /t/starlight-linux-386 -version'

      - name: Validación de configuración en i386 (sin llamar al LLM)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          docker run --rm -v "$PWD/dist:/t:ro" -v "$PWD/configs:/c:ro" --platform linux/386 \
            i386/debian:bookworm-slim sh -c \
            'STARLIGHT_LLM_API_KEY=prueba /t/starlight-agent-386 -config /c/agent.yaml.example -validar-config'

      - uses: actions/upload-artifact@v7
        with:
          name: starlight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.AGENTE }}
            ${{ env.CHAT }}
          if-no-files-found: error

  publicar:
    name: publicar release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: compilar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
