name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # With no external dependencies there is nothing to cache: setup-go would warn
  # that go.sum does not exist. The project builds with the standard library only.
  GOFLAGS: -mod=mod

jobs:
  verify:
    name: fmt · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (with race detector)
        run: go test -count=1 -race ./...

      - name: coverage gate (100% per package)
        run: |
          # Every package with tests must be fully covered: the gate is what keeps
          # the suite honest, and it is checked package by package so a gap cannot
          # hide behind the aggregate.
          MIN_PER_PACKAGE=100.0
          failed=0
          for pkg in $(go list ./internal/... ./cmd/...); do
            if go test -count=1 -cover "$pkg" 2>/dev/null | grep -q 'no test files'; then
              echo "::warning::$pkg has no test files"
              continue
            fi
            cov="$(go test -count=1 -cover "$pkg" 2>/dev/null | grep -oE 'coverage: [0-9.]+' | grep -oE '[0-9.]+' || echo 0)"
            printf '%-52s %s%%\n' "$pkg" "$cov"
            if awk -v c="$cov" -v m="$MIN_PER_PACKAGE" 'BEGIN { if (c < m) exit 1 }'; then
              :
            else
              echo "::error::$pkg coverage ${cov}% is below the ${MIN_PER_PACKAGE}% gate"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          go test -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... >/dev/null
          printf 'aggregate: '; go tool cover -func=coverage.out | tail -1

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: "386", check32: "true" }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
      AGENT: dist/starlight-agent-${{ matrix.goos }}-${{ matrix.goarch }}
      CHAT: dist/starlight-${{ matrix.goos }}-${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Build static binaries (agent + chat)
        run: |
          mkdir -p dist
          version="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$AGENT" ./cmd/agent
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$CHAT" ./cmd/chat
          ls -l dist

      - name: Verify the binaries are 32-bit and within the size limit
        if: matrix.check32 == 'true'
        run: |
          for binary in "$AGENT" "$CHAT"; do
            file "$binary"
            file "$binary" | grep -q "ELF 32-bit" || { echo "::error::$binary is not 32-bit"; exit 1; }
            # Check independent of `file`: byte 5 of the ELF header
            # (0x01 = ELFCLASS32).
            header="$(head -c 5 "$binary" | od -An -tx1 | tr -d ' \n')"
            [ "$header" = "7f454c4601" ] || { echo "::error::unexpected ELF header in $binary: $header"; exit 1; }
            echo "ELFCLASS32 confirmed in $binary ($header)"
            # Quality requirement: the final binary must weigh under 10 MB.
            bytes="$(stat -c%s "$binary")"
            [ "$bytes" -lt 10485760 ] || { echo "::error::$binary weighs $bytes bytes (limit: 10 MB)"; exit 1; }
            echo "$binary: $bytes bytes (< 10 MB)"
          done

      - name: Run the binaries in an i386 container (smoke test)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          chmod +x dist/*
          echo "contents of dist/:"
          ls -l dist/
          # The real artifact name is used (AGENT and CHAT include goos-goarch),
          # never a hand-written one.
          docker run --rm -v "$PWD/dist:/t:ro" --platform linux/386 \
            i386/debian:bookworm-slim sh -c "/t/$(basename "$AGENT") -version; /t/$(basename "$CHAT") -version"

      - name: Configuration validation on i386 (without calling the LLM)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          docker run --rm -v "$PWD/dist:/t:ro" -v "$PWD/configs:/c:ro" --platform linux/386 \
            i386/debian:bookworm-slim sh -c \
            "STARLIGHT_LLM_API_KEY=test STARLIGHT_SANDBOX_CGROUPS=off /t/$(basename "$AGENT") -config /c/agent.yaml.example -validar-config"

      - name: Agent end-to-end test (i386 container)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          chmod +x scripts/e2e-agent-i386.sh
          IMAGEN=i386/debian:bookworm-slim ./scripts/e2e-agent-i386.sh

      - name: Chat end-to-end test (i386 container)
        if: matrix.goos == 'linux' && matrix.goarch == '386'
        run: |
          chmod +x scripts/e2e-i386.sh
          IMAGEN=i386/debian:bookworm-slim ./scripts/e2e-i386.sh

      - uses: actions/upload-artifact@v7
        with:
          name: starlight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.AGENT }}
            ${{ env.CHAT }}
          if-no-files-found: error

  release:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
