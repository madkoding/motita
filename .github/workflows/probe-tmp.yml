name: probe-tmp
on:
  push:
    branches: [claude/project-thread-xa9cqq]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: probes
        run: |
          set +e
          echo "restrict=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)"; uname -r; id -u
          ls /etc/apparmor.d | head -50
          echo "--- unshare -Urn (lo up?)"
          unshare -Urn sh -c 'cat /proc/net/dev | tail -n +3; ip link set lo up; echo rc=$?; id' 2>&1
          echo "--- unshare -n only"
          unshare -n true; echo rc=$?
          echo "--- bwrap"
          sudo apt-get install -y bubblewrap >/dev/null 2>&1; which bwrap
          bwrap --ro-bind / / --unshare-net --dev /dev sh -c 'cat /proc/net/dev | tail -n +3; ip link set lo up; echo rc=$?' 2>&1
          ls /etc/apparmor.d | grep -i -E "bwrap|unshare"
          echo "--- landlock/seccomp"
          grep -i -E "landlock|apparmor" /sys/kernel/security/lsm
          cat /sys/kernel/security/landlock/abi_version 2>&1 || true
      - name: apparmor profile for a binary
        run: |
          set +e
          cp /usr/bin/unshare /tmp/myunshare
          sudo tee /etc/apparmor.d/tmp.myunshare >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>
          profile myunshare /tmp/myunshare flags=(unconfined) {
            userns,
            include if exists <local/myunshare>
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/tmp.myunshare; echo parser=$?
          /tmp/myunshare -Urn sh -c 'cat /proc/net/dev | tail -n +3; ip link set lo up; echo rc=$?; cat /proc/self/status | grep Cap' 2>&1
