# Security and quality analysis -> SonarQube (sonar.kodingvibes.com).
# Sonar Community does no taint analysis (SQLi, XSS, path traversal...): Semgrep OSS and
# CodeQL do, and their SARIF is imported into Sonar.
# Secrets: SONAR_TOKEN and SONAR_HOST_URL.
#
# A pull request analyses only new code: Semgrep against the base commit and CodeQL with its
# queries limited to the diff, and any finding fails the job. Sonar Community has a single
# branch and every analysis replaces the previous one, so the full analysis (with coverage and
# the quality gate) runs only on main and by hand (workflow_dispatch).
name: sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # --baseline-commit needs the PR's history
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Semgrep OSS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Pinned: a new release brings new rules, and --error would turn an untouched PR red.
          pip install semgrep==1.181.0
          # On a PR: only the findings the PR introduces, and --error fails the job.
          pr_args=()
          if [ -n "$BASE_SHA" ]; then pr_args=(--baseline-commit "$BASE_SHA" --error); fi
          semgrep scan --config p/owasp-top-ten --config p/security-audit --config p/golang \
            --exclude node_modules --exclude vendor --exclude target --exclude dist \
            --sarif --output semgrep.sarif --metrics=off "${pr_args[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          output: codeql-sarif
      - run: cp codeql-sarif/*.sarif codeql.sarif
      # On a PR CodeQL already limits results to the changed lines: any result is new.
      - name: No new CodeQL findings
        if: github.event_name == 'pull_request'
        run: |
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' codeql.sarif
          test "$(jq '[.runs[].results[]] | length' codeql.sarif)" -eq 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sarif-codeql
          path: codeql.sarif

  sonar:
    # Full analysis only outside PRs (see the header).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    needs: [semgrep, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - id: sarif
        run: echo "paths=$(ls sarif/*.sarif | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Build web UI (go:embed needs the assets)
        run: cd web && npm ci && npm run build
      # The project's only coverage source: the test gate lives in ci.yml; here the profile only
      # feeds the analysis, so a failing package is printed but does not stop it.
      - name: Coverage report for SonarQube
        env:
          GOFLAGS: -mod=mod
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... 2>&1 \
            | grep -Ev '^(ok|\?) ' || true
          test -s coverage.out
      # The web UI's half: node --test maps the bundled TSX back to its sources, and the gate in
      # ci.yml is what keeps it at 100 %; here a failing test does not stop the analysis either.
      # The report names files relative to web/, Sonar resolves them from the repository root.
      - name: Web coverage report for SonarQube
        run: |
          (cd web && npm run test:coverage >/dev/null 2>&1) || echo "::warning::web tests failed"
          sed -i 's#^SF:src/#SF:web/src/#' web/coverage/lcov.info
          test -s web/coverage/lcov.info
      - id: scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: -Dsonar.sarifReportPaths=${{ steps.sarif.outputs.paths }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # The quality gate (security, reliability, maintainability A and duplication <= 3 %) blocks CI.
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Leaves the gate status, the measures and the open findings in the job summary, so they
      # can be read without opening the Sonar server.
      - name: Sonar report
        if: always() && steps.scan.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./scripts/sonar-report.sh | tee -a "$GITHUB_STEP_SUMMARY"
