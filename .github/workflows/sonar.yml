# Análisis de seguridad y calidad -> SonarQube (sonar.kodingvibes.com).
# Sonar Community no hace análisis de taint (SQLi, XSS, path traversal...): lo hacen
# Semgrep OSS y CodeQL, y su SARIF se importa a Sonar.
# Secrets: SONAR_TOKEN y SONAR_HOST_URL.
#
# En un pull request se analiza solo el código nuevo: Semgrep contra el commit base y CodeQL
# con sus consultas limitadas al diff, y cualquier hallazgo hace fallar el job. Sonar Community
# tiene una sola rama y cada análisis reemplaza el anterior, así que el análisis completo (con
# cobertura y quality gate) corre solo en main y a mano (workflow_dispatch).
name: sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # --baseline-commit necesita el historial del PR
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Semgrep OSS
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          pip install semgrep
          # En un PR: solo los hallazgos que el PR introduce, y --error hace fallar el job.
          pr_args=()
          if [ -n "$BASE_SHA" ]; then pr_args=(--baseline-commit "$BASE_SHA" --error); fi
          semgrep scan --config p/owasp-top-ten --config p/security-audit --config p/golang \
            --exclude node_modules --exclude vendor --exclude target --exclude dist \
            --sarif --output semgrep.sarif --metrics=off "${pr_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: go
          queries: security-extended
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          output: codeql-sarif
      - run: cp codeql-sarif/*.sarif codeql.sarif
      # En un PR CodeQL ya limita los resultados a las líneas cambiadas: cualquiera es nuevo.
      - name: No new CodeQL findings
        if: github.event_name == 'pull_request'
        run: |
          jq -r '.runs[].results[] | "::error file=\(.locations[0].physicalLocation.artifactLocation.uri),line=\(.locations[0].physicalLocation.region.startLine)::\(.ruleId): \(.message.text)"' codeql.sarif
          test "$(jq '[.runs[].results[]] | length' codeql.sarif)" -eq 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-codeql
          path: codeql.sarif

  sonar:
    # Análisis completo solo fuera de los PR (ver la cabecera).
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    needs: [semgrep, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - id: sarif
        run: echo "paths=$(ls sarif/*.sarif | paste -sd, -)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build web UI (go:embed needs the assets)
        run: cd web && npm ci && npm run build
      # Única fuente de cobertura del proyecto: el gate de tests vive en ci.yml; aquí el perfil
      # solo alimenta el análisis, así que un paquete que falla se imprime pero no lo detiene.
      - name: Coverage report for SonarQube
        env:
          GOFLAGS: -mod=mod
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./... 2>&1 \
            | grep -Ev '^(ok|\?) ' || true
          test -s coverage.out
      - id: scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        with:
          args: -Dsonar.sarifReportPaths=${{ steps.sarif.outputs.paths }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # El quality gate (seguridad, fiabilidad, mantenibilidad A y duplicación <= 3 %) bloquea el CI.
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Deja el estado del gate, las métricas y los hallazgos abiertos en el resumen del job,
      # para revisarlos sin entrar al servidor de Sonar.
      - name: Sonar report
        if: always() && steps.scan.outcome == 'success'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: ./scripts/sonar-report.sh | tee -a "$GITHUB_STEP_SUMMARY"
