name: pages

# Publishes site/ to GitHub Pages.
#
# The site/ directory is plain static HTML: no build step, no node_modules, no
# bundler. So this workflow has exactly one job — hand the directory to Pages —
# and it deliberately does NOT run the test suite. ci.yml already gates every
# push to main, and a documentation site should not be able to fail a build for a
# reason that has nothing to do with the code.
#
# It does ONE write to the directory before uploading it: the version stamp.
# A page that advertises the version has to get it from the release rather than
# from a sentence somebody remembered to update, and a hand-written number in a
# static file is wrong the day after the next tag.
on:
  # TAGS ONLY, plus a manual dispatch. NOT `branches: [main]`, and the reason is
  # measured rather than stylistic.
  #
  # A merge to main and the tag cut on that same merge trigger this deploy twice on
  # the SAME commit. The main run starts a few seconds earlier - before the tag
  # exists - so it stamps the PREVIOUS release. GitHub Pages then keys a deployment
  # on the commit (`pages_build_version` is the SHA), so both runs are the same
  # artifact: the first one to publish wins and the other is a no-op.
  #
  # Measured on v0.8.2: the merge deploy stamped v0.8.1, the tag's own deploy did
  # nothing, and re-running EITHER of them left the live page on v0.8.1. That was
  # confirmed at the origin, not the CDN - a non-entry file fetched with a unique
  # query string still reported `x-cache: MISS` and `last-modified` at the merge
  # deploy's timestamp.
  #
  # Deploying only on tags removes the race by removing the second contender: a
  # release is the moment the version is known, and the page publishes with it.
  # Editing site/ on main no longer publishes by itself - run this workflow from
  # the Actions tab when the page must go live between releases, which is one
  # click and is deliberate rather than accidental.
  #
  # NESTED under push, not a sibling of it. `on.tags` is not a trigger GitHub
  # knows, and an unrecognised key there does not warn - the whole workflow
  # fails instantly with "workflow file issue", no job, no log. That is exactly
  # how this was first written, and the pages run on main was green right up
  # until the branch that carried it.
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it: the artifact is cheap and
# a half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: publish site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The version comes from the tag HISTORY, so the tags have to be here.
          # A shallow clone has none, and `git describe` would answer with a bare
          # commit hash - a "version" no release page has ever shown.
          fetch-depth: 0

      - name: Stamp the version the page advertises
        # Which tag is "the version" here?
        #
        # On a tag push it is literally the tag being pushed, so GITHUB_REF_NAME is
        # the answer and no git command is involved.
        #
        # A manual dispatch runs on a BRANCH, so it asks which v* tag names the
        # commit being published, and falls back to the newest reachable one. Two
        # traps live in that sentence, both measured on git 2.47.3 and both SILENT:
        #
        #   - `git tag --points-at X --match Y` fails with "unknown option: `match'".
        #     Stdout is then empty, which reads as "no tag here" and falls through.
        #     The pattern goes POSITIONALLY: `git tag -l --points-at HEAD 'v*'`.
        #   - The order tags come back in is NOT the version order. The default is
        #     lexicographic ascending, so v3.9.0 precedes v3.10.0, and even
        #     `--sort=-refname` ranks v3.9.0 as the greatest. `sort -V` is a real
        #     version sort and ranks v3.10.0 correctly. (Note that `-v:refname`
        #     DOES version-sort correctly, so a sort spec cannot be judged by its
        #     shape - it was measured, with v3.1.0/v3.2.0/v3.9.0/v3.10.0, before
        #     being written down here.)
        #
        # The marker in site/index.html is replaced in place and the job FAILS if
        # it is absent: a page whose version cannot be stamped would otherwise be
        # published still showing the v0.0.0 fallback, and nothing on the site
        # would say so.
        run: |
          set -eu
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git tag -l --points-at HEAD 'v*' 2>/dev/null | grep -E '^v[0-9]' | sort -V | tail -1 || true)"
            if [ -z "$version" ]; then
              version="$(git tag --merged HEAD -l 'v*' 2>/dev/null | grep -E '^v[0-9]' | sort -V | tail -1 || true)"
            fi
          fi
          if [ -z "$version" ]; then
            echo "::error::no v* tag is reachable, so there is no version to publish"
            exit 1
          fi
          echo "stamping the site with $version"
          if ! grep -q 'data-motita-version' site/index.html; then
            echo "::error file=site/index.html::the version marker is gone; the page would publish an unstamped version"
            exit 1
          fi
          version="$version" python3 - <<'PY'
          import os, pathlib, re
          v = os.environ["version"]
          p = pathlib.Path("site/index.html")
          src = p.read_text(encoding="utf-8")
          # Inside the marker element only, so a mention of another version
          # elsewhere in the prose is not rewritten by accident.
          new, n = re.subn(
              r'(<span data-motita-version>)[^<]*(</span>)',
              lambda m: m.group(1) + v + m.group(2),
              src,
          )
          if n != 1:
              raise SystemExit(f"expected exactly one version marker, found {n}")
          p.write_text(new, encoding="utf-8")
          print("stamped:", v)
          PY
          grep -o 'data-motita-version>[^<]*' site/index.html

      - name: Verify the site is self-contained
        # ONE implementation, two callers: scripts/verify-site.sh is what runs here
        # and what `verify.sh` runs locally (step 8e). It checks every local
        # href/src and CSS url() against site/, and that the installer the page
        # advertises is actually shipped and byte-identical to scripts/install.sh.
        #
        # Why a gate at all: site/ is uploaded ON ITS OWN, so a reference that
        # resolves because docs/ sits beside the page is dead in production, and
        # a missing font does not 404 - it renders every heading in the fallback
        # face while every status code stays 200.
        run: ./scripts/verify-site.sh site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
