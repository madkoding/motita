# Weekly dependency updates, one grouped pull request per ecosystem.
# Security updates are grouped too (applies-to: security-updates), so several
# advisories on the same day give one pull request per ecosystem, not one each.
#
# The Go module has no external dependencies today, so the gomod entry mostly
# watches the toolchain directive; it is here so a dependency added later is not
# forgotten. Actions are pinned by commit SHA (see the workflows), and Dependabot
# updates the SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # A release is only proposed once it has been out for a few days, so a malicious or broken
    # one is usually yanked before a pull request offers it.
    cooldown:
      default-days: 7
    groups:
      go:
        patterns: ["*"]
      go-security:
        applies-to: security-updates
        patterns: ["*"]

  # Release tooling only (semantic-release).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # A release is only proposed once it has been out for a few days, so a malicious or broken
    # one is usually yanked before a pull request offers it.
    cooldown:
      default-days: 7
    # Major 10 of the preset needs conventional-changelog-writer@9, but
    # @semantic-release/release-notes-generator still loads writer@8 and the
    # release fails at generateNotes. Lift this once the generator moves on.
    ignore:
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
    groups:
      release-tooling:
        patterns: ["*"]
      release-tooling-security:
        applies-to: security-updates
        patterns: ["*"]

  # The web UI, embedded in the binary.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # A release is only proposed once it has been out for a few days, so a malicious or broken
    # one is usually yanked before a pull request offers it.
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
      web-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A release is only proposed once it has been out for a few days, so a malicious or broken
    # one is usually yanked before a pull request offers it.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
