sonar.projectKey=madkoding_motita_ff50ef4c-90ae-42fc-a3ee-42f06a8c4caf

# Go tests are analysed as tests, not as production code.
sonar.sources=.
# site/architecture.html is generated by archify (scripts/render-architecture.sh) from
# site/motita-arch.json: its 830 KB are a build artifact whose findings (an <html> inside a CSS
# comment read as a second page, role="button" nodes whose keys are handled by one delegated
# listener) can only be fixed in the generator, never in the committed output.
sonar.exclusions=**/*_test.go,web/src/__tests__/**,**/node_modules/**,internal/webui/assets/**,site/architecture.html
sonar.tests=.
# The web UI's node --test suite is test code too: analysed as tests, never measured for coverage.
sonar.test.inclusions=**/*_test.go,web/src/__tests__/**

# Written by the coverage steps of the sonar job in .github/workflows/sonar.yml.
sonar.go.coverage.reportPaths=coverage.out
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Code that is analysed for issues but cannot be measured for coverage by the analysis run:
# - *_windows.go and *_other.go are the variants of a platform split that the Linux runner never
#   compiles (their build constraint excludes linux), so no Linux run can execute them. The one
#   *_other.go that Linux does build (termcap/vt_other.go, !windows) is a one-line no-op.
# - tools/clitest and tools/seccomptrap are test harnesses: clitest's only uncovered statements
#   are its own t.Fatal/t.Skip branches (ci.yml exempts it from the 100 % gate for that reason)
#   and seccomptrap is the program the android-seccomp job runs under a seccomp filter.
# - scripts/ and web/scripts/ are development and CI tooling (browser checks over CDP, build
#   helpers, the web coverage gate): they test the product, and ship in no release.
# - docs/ holds the generators of the README artwork and screenshots, run by hand.
# - web/vite.config.ts is build configuration, read by vite and never by the app.
sonar.coverage.exclusions=**/*_windows.go,**/*_other.go,tools/clitest/**,tools/seccomptrap/**,scripts/**,web/scripts/**,docs/**,web/vite.config.ts
# Los scripts .py son herramientas de desarrollo; versiones con las que se ejecutan.
sonar.python.version=3.12,3.13
sonar.sourceEncoding=UTF-8

# S1451 (copyright/licence header on every file) does not apply: motita carries its licence in
# LICENSE, not in a header per file. Ignored for this project only; the shared profile keeps it.
sonar.issue.ignore.multicriteria=header1,header2,header3
sonar.issue.ignore.multicriteria.header1.ruleKey=go:S1451
sonar.issue.ignore.multicriteria.header1.resourceKey=**/*
sonar.issue.ignore.multicriteria.header2.ruleKey=typescript:S1451
sonar.issue.ignore.multicriteria.header2.resourceKey=**/*
sonar.issue.ignore.multicriteria.header3.ruleKey=javascript:S1451
sonar.issue.ignore.multicriteria.header3.resourceKey=**/*
