sonar.projectKey=madkoding_motita_ff50ef4c-90ae-42fc-a3ee-42f06a8c4caf

# Go tests are analysed as tests, not as production code.
sonar.sources=.
# site/architecture.html is generated by archify (scripts/render-architecture.sh) from
# site/motita-arch.json: its 830 KB are a build artifact whose findings (an <html> inside a CSS
# comment read as a second page, role="button" nodes whose keys are handled by one delegated
# listener) can only be fixed in the generator, never in the committed output.
sonar.exclusions=**/*_test.go,**/node_modules/**,internal/webui/assets/**,site/architecture.html
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Written by the coverage step of the sonar job in .github/workflows/sonar.yml.
sonar.go.coverage.reportPaths=coverage.out
# Los scripts .py son herramientas de desarrollo; versiones con las que se ejecutan.
sonar.python.version=3.12,3.13
sonar.sourceEncoding=UTF-8

# S1451 (copyright/licence header on every file) does not apply: motita carries its licence in
# LICENSE, not in a header per file. Ignored for this project only; the shared profile keeps it.
sonar.issue.ignore.multicriteria=header1,header2,header3
sonar.issue.ignore.multicriteria.header1.ruleKey=go:S1451
sonar.issue.ignore.multicriteria.header1.resourceKey=**/*
sonar.issue.ignore.multicriteria.header2.ruleKey=typescript:S1451
sonar.issue.ignore.multicriteria.header2.resourceKey=**/*
sonar.issue.ignore.multicriteria.header3.ruleKey=javascript:S1451
sonar.issue.ignore.multicriteria.header3.resourceKey=**/*
