<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><g stroke='%234cc2ff' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'><path d='M8 24 Q4 18 6 12 L4 6 L12 11 Q16 8 20 11 L28 6 L26 12 Q28 18 24 24 Z'/><circle cx='13' cy='16' r='1.5' fill='%234cc2ff' stroke='none'/><circle cx='21' cy='16' r='1.5' fill='%234cc2ff' stroke='none'/><path d='M16 20 L18 22 L20 20'/><path d='M24 24 Q28 22 30 18'/></g></svg>">
<title>Motita</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="scene">
  <div class="layer" data-depth="0.02" id="layer-particles"></div>
  <div class="layer" data-depth="0.06" id="layer-cats"></div>
  <div class="layer" data-depth="0.04" id="layer-holo"></div>
  <div class="layer" data-depth="0.0" id="layer-ui">
    <header>
      <div class="brand">
        <span class="logo"><svg viewBox="0 0 32 32" width="22" height="22"><g stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24 Q4 18 6 12 L4 6 L12 11 Q16 8 20 11 L28 6 L26 12 Q28 18 24 24 Z"/><circle cx="13" cy="16" r="1.5" fill="currentColor" stroke="none"/><circle cx="21" cy="16" r="1.5" fill="currentColor" stroke="none"/><path d="M16 20 L18 22 L20 20"/><path d="M24 24 Q28 22 30 18"/></g></svg></span>
        <h1>Motita</h1>
      </div>
      <span id="state" aria-live="polite">connecting</span>
    </header>
    <main id="conversation" role="log" aria-live="polite" aria-label="conversation"></main>
    <form id="composer">
      <label for="task" class="visually-hidden">Task</label>
      <textarea id="task" rows="2" placeholder="Ask for something…"></textarea>
      <button type="submit">Send</button>
    </form>
    <div id="approval" hidden></div>
  </div>
</div>
<script src="/app.js?v=3"></script>
</body>
</html>
