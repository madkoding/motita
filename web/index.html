<!doctype html>
<html lang="en" style="color-scheme: dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Dark, deliberately and permanently. Announced to the UA before the
       bundle arrives, so the page never paints a light scrollbar or a white
       overscroll gutter for one frame on a phone set to light. The stylesheet
       carries the same declaration for the JS-disabled case. -->
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0a0f">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <title>Motita</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
