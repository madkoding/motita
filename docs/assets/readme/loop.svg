<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="How motita works: the model proposes, the sandbox runs, your check decides">
<title>How motita works: the model proposes, the sandbox runs, your check decides</title>
<defs><style>@font-face{font-family:'JBM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Sansation';src:url(data:font/woff2;base64,) format('woff2');}.m{font-family:'JBM',ui-monospace,monospace;font-weight:700}.s{font-family:'Sansation',system-ui,sans-serif}@keyframes flow{to{stroke-dashoffset:-24}}.f{stroke-dasharray:6 6;animation:flow 1s linear infinite}</style><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="rgba(255,255,255,0.035)"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#4cc2ff"/></marker>
<marker id="ar-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#ff6b6b"/></marker>
<clipPath id="frame"><path d="M18,0 H1280 V342 L1262,360 H0 V18 Z"/></clipPath></defs>
<g clip-path="url(#frame)"><rect width="1280" height="360" fill="#0a0a0f"/><rect width="1280" height="360" fill="url(#grid)"/></g>
<path d="M19,1 H1279 V341 L1261,359 H1 V19 Z" fill="none" stroke="#00f0ff" stroke-opacity=".3"/>
<path d="M930,106 V58 H410 V102" fill="none" stroke="#ff6b6b" stroke-width="2" class="f" marker-end="url(#ar-rose)"/><rect x="480" y="44" width="380" height="28" fill="#0a0a0f"/><text x="670" y="63" class="m" font-size="13" text-anchor="middle" fill="#ff6b6b">FAIL · the real error goes back to the model</text><path d="M50,110 H260 V240 L250,250 H40 V120 Z" fill="#16161e" stroke="#7a7a8c" stroke-opacity="0.5"/><rect x="40" y="247" width="210" height="3" fill="#7a7a8c" fill-opacity=".8"/><text x="58" y="140" class="m" font-size="12" letter-spacing="1.3" fill="#7a7a8c">TASK</text><text x="58" y="172" class="m" font-size="18" fill="#e8e8ea">You ask</text><text x="58" y="202" class="s" font-size="14.5" fill="#9a9aaa">in plain words, plus</text><text x="58" y="223" class="s" font-size="14.5" fill="#9a9aaa">the check that proves it</text><path d="M310,110 H520 V240 L510,250 H300 V120 Z" fill="#16161e" stroke="#f0a040" stroke-opacity="0.5"/><rect x="300" y="247" width="210" height="3" fill="#f0a040" fill-opacity=".8"/><text x="318" y="140" class="m" font-size="12" letter-spacing="1.3" fill="#f0a040">B · MODEL</text><text x="318" y="172" class="m" font-size="18" fill="#e8e8ea">Proposes</text><text x="318" y="202" class="s" font-size="14.5" fill="#9a9aaa">an action. It never gets</text><text x="318" y="223" class="s" font-size="14.5" fill="#9a9aaa">to declare success.</text><path d="M570,110 H780 V240 L770,250 H560 V120 Z" fill="#16161e" stroke="#4cc2ff" stroke-opacity="0.5"/><rect x="560" y="247" width="210" height="3" fill="#4cc2ff" fill-opacity=".8"/><text x="578" y="140" class="m" font-size="12" letter-spacing="1.3" fill="#4cc2ff">C · SANDBOX</text><text x="578" y="172" class="m" font-size="18" fill="#e8e8ea">Runs it</text><text x="578" y="202" class="s" font-size="14.5" fill="#9a9aaa">under real limits: memory,</text><text x="578" y="223" class="s" font-size="14.5" fill="#9a9aaa">CPU, time, no network.</text><path d="M830,110 H1040 V240 L1030,250 H820 V120 Z" fill="#16161e" stroke="#00f0ff" stroke-opacity="0.9"/><rect x="820" y="247" width="210" height="3" fill="#00f0ff" fill-opacity=".8"/><text x="838" y="140" class="m" font-size="12" letter-spacing="1.3" fill="#00f0ff">A · ANCHOR</text><text x="838" y="172" class="m" font-size="18" fill="#e8e8ea">Your code decides</text><text x="838" y="202" class="s" font-size="14.5" fill="#9a9aaa">exit code, output, your</text><text x="838" y="223" class="s" font-size="14.5" fill="#9a9aaa">own tests. No opinions.</text><path d="M1090,110 H1240 V240 L1230,250 H1080 V120 Z" fill="#16161e" stroke="#5ee08a" stroke-opacity="0.5"/><rect x="1080" y="247" width="150" height="3" fill="#5ee08a" fill-opacity=".8"/><text x="1098" y="140" class="m" font-size="12" letter-spacing="1.3" fill="#5ee08a">PASS</text><text x="1098" y="172" class="m" font-size="18" fill="#e8e8ea">Ships</text><text x="1098" y="202" class="s" font-size="14.5" fill="#9a9aaa">commit · push</text><text x="1098" y="223" class="s" font-size="14.5" fill="#9a9aaa">publish · notify</text><path d="M262,180.0 H296" stroke="#4cc2ff" stroke-width="2" class="f" marker-end="url(#ar)"/><path d="M522,180.0 H556" stroke="#4cc2ff" stroke-width="2" class="f" marker-end="url(#ar)"/><path d="M782,180.0 H816" stroke="#4cc2ff" stroke-width="2" class="f" marker-end="url(#ar)"/><path d="M1042,180.0 H1076" stroke="#4cc2ff" stroke-width="2" class="f" marker-end="url(#ar)"/><path d="M930,256 V302 H700" fill="none" stroke="#ff2bd6" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 5"/><text x="690" y="307" class="m" font-size="13" text-anchor="end" fill="#ff2bd6">out of retries → escalate, never a fake PASS</text>
</svg>
