<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Motita: the AI agent that proves it's done">
<title>Motita: the AI agent that proves it's done</title>
<defs><style>@font-face{font-family:'JBM';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'JBMR';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Sansation';src:url(data:font/woff2;base64,) format('woff2');}.m{font-family:'JBM',ui-monospace,monospace;font-weight:700}.r{font-family:'JBMR',ui-monospace,monospace;white-space:pre}.s{font-family:'Sansation',system-ui,sans-serif}@keyframes in{from{opacity:0;transform:translateY(6px)}}@keyframes blink{50%{opacity:0}}@keyframes draw{from{transform:scaleX(0)}}.l{animation:in .6s cubic-bezier(.16,1,.3,1) backwards}.u{transform-box:fill-box;transform-origin:left;animation:draw .8s 1s cubic-bezier(.16,1,.3,1) backwards}.c{animation:blink 1.1s steps(1) infinite}</style><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0 H0 V32" fill="none" stroke="rgba(255,255,255,0.035)"/></pattern>
<radialGradient id="glow" cx="18%" cy="30%" r="60%"><stop offset="0" stop-color="#4cc2ff" stop-opacity=".16"/><stop offset="1" stop-color="#4cc2ff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow2" cx="85%" cy="80%" r="45%"><stop offset="0" stop-color="#ff2bd6" stop-opacity=".10"/><stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/></radialGradient>
<filter id="neon" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><path d="M22,0 H1280 V398 L1258,420 H0 V22 Z"/></clipPath></defs>
<g clip-path="url(#frame)">
<rect width="1280" height="420" fill="#0a0a0f"/><rect width="1280" height="420" fill="url(#grid)"/>
<rect width="1280" height="420" fill="url(#glow)"/><rect width="1280" height="420" fill="url(#glow2)"/>
</g>
<path d="M23,1 H1279 V397 L1257,419 H1 V23 Z" fill="none" stroke="#00f0ff" stroke-opacity=".45"/>
<g class="l"><rect x="64" y="64" width="416" height="30" fill="#4cc2ff" fill-opacity=".2"/>
<circle cx="80" cy="79" r="3.5" fill="#4cc2ff"/>
<text x="94" y="84.5" class="m" font-size="14" letter-spacing="1.4" fill="#4cc2ff">FREE &amp; OPEN SOURCE · ZERO DEPENDENCIES</text></g>
<g class="l" style="animation-delay:.1s"><g transform="translate(64,120) scale(1.15)"><g stroke="#4cc2ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24 Q4 18 6 12 L4 6 L12 11 Q16 8 20 11 L28 6 L26 12 Q28 18 24 24 Z"/><circle cx="13" cy="16" r="1.5" fill="#4cc2ff" stroke="none"/><circle cx="21" cy="16" r="1.5" fill="#4cc2ff" stroke="none"/><path d="M16 20 L18 22 L20 20"/><path d="M24 24 Q28 22 30 18"/></g></g>
<text x="112" y="148" class="m" font-size="28" fill="#4cc2ff">Motita</text></g>
<g class="l" style="animation-delay:.25s"><text x="64" y="218" class="m" font-size="50" letter-spacing="-1.2" fill="#e8e8ea">The AI agent that</text></g>
<g class="l" style="animation-delay:.45s"><text x="64" y="280" class="m" font-size="50" letter-spacing="-1.2" fill="#e8e8ea"><tspan fill="#ff2bd6" filter="url(#neon)">proves</tspan> it's done.</text>
<rect class="u" x="64" y="291" width="177" height="5" fill="#ff2bd6" filter="url(#neon)"/></g>
<g class="l" style="animation-delay:.6s"><text x="64" y="336" class="s" font-size="19" fill="#9a9aaa">Writes the change, runs your real tests, reads the failures</text>
<text x="64" y="362" class="s" font-size="19" fill="#9a9aaa">and fixes them. It only says done when the check passes.</text></g>
<g class="l" style="animation-delay:.3s">
<path d="M712,92 H1220 V330 L1208,342 H700 V104 Z" fill="#16161e" stroke="#00f0ff" stroke-opacity=".35"/>
<path d="M712,126 H1220" stroke="rgba(255,255,255,0.10)"/>
<circle cx="726" cy="109" r="4.5" fill="rgba(255,255,255,.14)"/><circle cx="742" cy="109" r="4.5" fill="rgba(255,255,255,.14)"/><circle cx="758" cy="109" r="4.5" fill="rgba(255,255,255,.14)"/>
<text x="782" y="114" class="r" font-size="13" fill="#7a7a8c">127.0.0.1:7477</text></g>
<g class="l" style="animation-delay:0.50s"><text x="728" y="174" class="r" font-size="17" fill="#4cc2ff">$</text><text x="754" y="174" class="r" font-size="17" fill="#e8e8ea">motita &quot;add a JSON export&quot;</text></g><g class="l" style="animation-delay:0.95s"><text x="728" y="208" class="r" font-size="17" fill="#ff6b6b">✕</text><text x="754" y="208" class="r" font-size="17" fill="#9a9aaa">attempt 1  go test: undefined: json</text></g><g class="l" style="animation-delay:1.40s"><text x="728" y="242" class="r" font-size="17" fill="#f0a040">↻</text><text x="754" y="242" class="r" font-size="17" fill="#9a9aaa">retry with the real error</text></g><g class="l" style="animation-delay:1.85s"><text x="728" y="276" class="r" font-size="17" fill="#5ee08a">✓</text><text x="754" y="276" class="r" font-size="17" fill="#9a9aaa">attempt 2  go test ./... ok</text></g><g class="l" style="animation-delay:2.30s"><text x="728" y="310" class="r" font-size="17" fill="#00f0ff">◆</text><text x="754" y="310" class="m" font-size="17" fill="#e8e8ea">DONE  3/3 checks · 2 files</text></g>
<text x="728" y="344" class="r c" font-size="17" fill="#4cc2ff">▍</text>
</svg>
