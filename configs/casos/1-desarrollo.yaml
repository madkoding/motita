# CASO 1 — Agente de desarrollo: tarea desde archivo + tests + commit
#
# Flujo: lee la tarea de un archivo -> el LLM analiza y planifica -> ejecuta los
# comandos en el sandbox -> el ANCLA corre los tests -> si pasan, se hace commit.
#
# Uso:
#   export STARLIGHT_LLM_API_KEY=sk-...
#   starlight -config configs/casos/1-desarrollo.yaml
#
# La tarea vive en tareas/pendiente.md y se puede cambiar sin tocar este YAML.

task_source:
  tipo: file
  ruta: ./tareas/pendiente.md

# Capa A: la verdad la dice la suite de pruebas, no el modelo.
anchor:
  tipo: command
  comando: go
  argumentos: [test, ./...]
  timeout: 300s
  esperar_exit: 0
  checks:
    - nombre: vet
      comando: go
      argumentos: [vet, ./...]
      timeout: 120s
      esperar_exit: 0
    - nombre: formato
      comando: gofmt
      argumentos: ["-l", "."]
      timeout: 60s
      esperar_exit: 0
      esperar_salida: "^$"   # gofmt callado = todo formateado

# Capa C: sin red, memoria y CPU acotadas. Compilar en una máquina i386 puede
# consumir bastante, de ahí los 1024 MB.
sandbox:
  tipo: cgroups
  memoria_mb: 1024
  cpu_segundos: 240
  procesos: 64
  tamano_max_archivo_mb: 128
  aislar_red: true
  timeout: 300s
  salida_max_kb: 512

llm:
  proveedor: openai
  modelo: gpt-4o-mini
  base_url: https://api.openai.com/v1
  max_tokens: 4096
  temperature: 0.1
  timeout: 120s
  max_intentos: 3

prompts:
  analyze:
    sistema: |
      Eres un agente de desarrollo con validación determinista por tests.
      Respondes sólo con JSON.
    usuario: |
      ## TAREA DE DESARROLLO
      {{tarea}}

      ## LO QUE SE EJECUTARÁ PARA VALIDAR
      {{reglas}}

      Analiza la tarea. Ten en cuenta que el código modificado debe pasar
      `go test ./...`, `go vet ./...` y `gofmt -l .` sin salida.

      Devuelve JSON: {"comprensible": bool, "resumen": "...",
                      "criterios_exito": ["..."], "riesgos": ["..."],
                      "necesita_subtareas": bool}
  plan:
    sistema: |
      Eres un agente de desarrollo. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## ANÁLISIS
      {{analisis}}

      Devuelve JSON: {"plan": [{"paso": 1, "accion": "...", "comando": "..."}],
                      "subtareas": ["..."], "resultado_esperado": "..."}
      Cada paso debe ser un comando de shell concreto y no destructivo.
  execute:
    sistema: |
      Eres un agente de desarrollo. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## PLAN
      {{plan}}

      ## DIRECTORIO DE TRABAJO
      {{workspace}}

      {{historial}}

      Devuelve JSON: {"razonamiento": "...",
                      "acciones": [{"tipo": "comando", "descripcion": "...",
                                    "comando": "..."}],
                      "accion_final": {"descripcion": "commit", "comando": ""}}

# Sólo se hace commit si los tests pasaron.
final_action:
  tipo: git_commit
  mensaje_commit: "agente: {{tarea}}"

agent:
  max_reintentos: 3
  profundidad_subtareas: 1
  workspace_dir: ./workspace/desarrollo
  log_file: ./workspace/desarrollo/starlight.log
  log_level: info
  graceful_shutdown_timeout: 20s
  escalar:
    tipo: command
    comando: 'echo "TAREA NO RESUELTA: revisar el registro" >> ./workspace/desarrollo/escalados.log'
