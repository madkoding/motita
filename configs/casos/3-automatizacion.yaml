# CASO 3 — Agente de automatización: cola de archivos + script + notificación
#
# Flujo: vigila un directorio en busca de archivos de trabajo -> por cada uno, el
# LLM propone el script/comando -> se ejecuta aislado -> el ANCLA comprueba que
# el efecto ocurrió -> si pasa, se envía una notificación por webhook.
#
# Pensado para una máquina i386 antigua que vigila carpetas compartidas o
# impresoras y avisa a un servidor central.
#
# Uso:
#   export STARLIGHT_LLM_API_KEY=sk-...
#   mkdir -p cola && echo "rotar los logs de /var/log/app" > cola/001.txt
#   starlight -config configs/casos/3-automatizacion.yaml

task_source:
  tipo: queue
  dir: ./cola
  intervalo: 15s      # cada cuánto mira si hay archivos nuevos

# Capa A: comprueba el EFECTO, no que el comando haya salido con 0. Si la tarea
# era dejar un archivo, el ancla verifica que el archivo esté ahí y no vacío.
anchor:
  tipo: command
  comando: sh
  argumentos: ["-c", "test -s ./resultado.ok && echo AUTOMATIZACION_OK"]
  timeout: 30s
  esperar_exit: 0
  esperar_salida: "AUTOMATIZACION_OK"
  checks:
    - nombre: sin restos temporales
      comando: sh
      argumentos: ["-c", "test -z \"$(ls *.tmp 2>/dev/null)\""]
      timeout: 15s
      esperar_exit: 0

# Capa C: mucho más restrictivo. Poca memoria, CPU corta, sin red (la
# notificación la hace el agente, no el comando) y archivos pequeños.
sandbox:
  tipo: cgroups
  memoria_mb: 256
  cpu_segundos: 30
  procesos: 16
  archivos_abiertos: 64
  tamano_max_archivo_mb: 16
  aislar_red: true
  timeout: 60s
  salida_max_kb: 64

llm:
  proveedor: openai
  modelo: gpt-4o-mini
  base_url: https://api.openai.com/v1
  max_tokens: 1024
  temperature: 0.0
  timeout: 60s
  max_intentos: 2      # una máquina lenta no debe quedarse reintentando eterno
  backoff_inicial: 1s
  backoff_max: 10s

prompts:
  analyze:
    sistema: |
      Eres un agente de automatización en una máquina pequeña. Respondes sólo
      con JSON. Tus comandos deben ser simples y reversibles.
    usuario: |
      ## AUTOMATIZACIÓN SOLICITADA
      {{tarea}}

      ## COMPROBACIONES QUE SE HARÁN
      {{reglas}}

      Devuelve JSON: {"comprensible": bool, "resumen": "...",
                      "criterios_exito": ["..."], "riesgos": ["..."],
                      "necesita_subtareas": bool}
  plan:
    sistema: |
      Eres un agente de automatización. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## ANÁLISIS
      {{analisis}}

      Devuelve JSON: {"plan": [{"paso": 1, "accion": "...", "comando": "..."}],
                      "subtareas": [], "resultado_esperado": "..."}
      Usa como máximo 3 pasos y herramientas disponibles en un sistema mínimo.
  execute:
    sistema: |
      Eres un agente de automatización. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## PLAN
      {{plan}}

      ## DIRECTORIO DE TRABAJO
      {{workspace}}

      {{historial}}

      Devuelve JSON: {"razonamiento": "...",
                      "acciones": [{"tipo": "comando", "descripcion": "...",
                                    "comando": "..."}],
                      "accion_final": {"descripcion": "notificar", "comando": ""}}
      El comando final debe dejar ./resultado.ok como señal de éxito.

# Notificación al servidor central, sólo si la validación pasó.
final_action:
  tipo: command
  comando: sh
  argumentos: ["-c", "curl -sf -X POST -H 'Content-Type: application/json' -d '{\"evento\":\"tarea_ok\"}' https://ejemplo.interno/hooks/starlight || logger -t starlight 'no se pudo notificar'"]

agent:
  max_reintentos: 1
  profundidad_subtareas: 0
  workspace_dir: ./workspace/automatizacion
  log_file: ./workspace/automatizacion/starlight.log
  log_level: info
  log_max_mb: 2
  log_backups: 2
  graceful_shutdown_timeout: 10s
  escalar:
    tipo: command
    comando: logger -t starlight "tarea de automatizacion no resuelta"
