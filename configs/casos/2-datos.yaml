# CASO 2 — Agente de análisis de datos: tarea desde API + validación + resultado
#
# Flujo: sondea una API de la que cuelga la tarea -> el LLM propone los comandos
# de análisis -> se ejecutan aislados sobre los datos -> el ANCLA comprueba
# invariantes del informe -> si pasa, se publica el resultado con un POST.
#
# Uso:
#   export STARLIGHT_LLM_API_KEY=sk-...
#   starlight -config configs/casos/2-datos.yaml
#
# Para probar sin una API real, apunta la fuente a un archivo:
#   starlight -config configs/casos/2-datos.yaml -archivo-tarea tareas/analisis.md

task_source:
  tipo: api
  url: https://ejemplo.interno/api/tareas/siguiente
  metodo: POST
  campo: tarea
  intervalo: 60s
  cuerpo: '{"cola": "analisis"}'
  headers:
    Authorization: Bearer CAMBIA_ESTO_POR_UN_TOKEN_DE_ENTORNO
    Accept: application/json

# Capa A: invariantes del resultado. Aquí no hay tests: lo que se valida es que
# el informe cumpla el contrato (existe, tiene filas, cuadra el total).
anchor:
  tipo: command
  comando: python3
  argumentos: [scripts/validar_informe.py, informe.json]
  timeout: 120s
  esperar_exit: 0
  esperar_salida: "INFORME_OK"
  checks:
    - nombre: informe generado
      comando: test
      argumentos: ["-s", "informe.json"]
      timeout: 10s
      esperar_exit: 0
    - nombre: cuadre de totales
      comando: python3
      argumentos: [scripts/cuadrar_totales.py, informe.json]
      timeout: 60s
      esperar_exit: 0

# Capa C: el análisis necesita leer los datos, pero no salir a la red (los datos
# ya están locales) y no puede comerse la máquina.
sandbox:
  tipo: cgroups
  memoria_mb: 1536
  cpu_segundos: 300
  procesos: 32
  tamano_max_archivo_mb: 256
  aislar_red: true
  timeout: 600s
  salida_max_kb: 1024

llm:
  proveedor: anthropic
  modelo: claude-sonnet-4-5
  base_url: https://api.anthropic.com
  max_tokens: 4096
  temperature: 0.0        # determinista: es análisis, no creatividad
  timeout: 180s
  max_intentos: 4
  backoff_inicial: 2s
  backoff_max: 60s

prompts:
  analyze:
    sistema: |
      Eres un analista de datos que trabaja con validación determinista.
      Respondes sólo con JSON y nunca inventas cifras.
    usuario: |
      ## TAREA DE ANÁLISIS
      {{tarea}}

      ## VALIDACIONES QUE SE APLICARÁN
      {{reglas}}

      Devuelve JSON: {"comprensible": bool, "resumen": "...",
                      "criterios_exito": ["..."], "riesgos": ["..."],
                      "necesita_subtareas": bool}
      Si la tarea exige datos que no están en el directorio de trabajo, marca
      "comprensible": false.
  plan:
    sistema: |
      Eres un analista de datos. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## ANÁLISIS
      {{analisis}}

      Devuelve JSON: {"plan": [{"paso": 1, "accion": "...", "comando": "..."}],
                      "subtareas": ["..."], "resultado_esperado": "..."}
      El último paso debe dejar el resultado en informe.json.
  execute:
    sistema: |
      Eres un analista de datos. Respondes sólo con JSON.
    usuario: |
      ## TAREA
      {{tarea}}

      ## PLAN
      {{plan}}

      ## DIRECTORIO DE TRABAJO
      {{workspace}}

      {{historial}}

      Devuelve JSON: {"razonamiento": "...",
                      "acciones": [{"tipo": "comando", "descripcion": "...",
                                    "comando": "..."}],
                      "accion_final": {"descripcion": "publicar", "comando": ""}}

# El resultado se publica sólo tras el PASS del ancla.
final_action:
  tipo: api
  url: https://ejemplo.interno/api/resultados
  metodo: POST

agent:
  max_reintentos: 4
  profundidad_subtareas: 2
  workspace_dir: ./workspace/datos
  log_file: ./workspace/datos/starlight.log
  log_level: info
  log_max_mb: 20
  log_backups: 5
  graceful_shutdown_timeout: 30s
  escalar:
    tipo: command
    comando: python3 scripts/avisar_fallo.py
