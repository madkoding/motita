# Configuración de la prueba de extremo a extremo en i386.
#
# El LLM simulado (tools/mockllm) hace de modelo: en el primer intento propone
# un comando que NO cumple la validación, y en el segundo el que sí. Así se
# ejercita de verdad el ciclo completo: análisis -> plan -> acción -> ancla ->
# reintento con los registros del fallo -> PASS -> acción final.

task_source:
  tipo: file
  ruta: /e2e/tarea.txt

anchor:
  tipo: command
  # El ancla comprueba el EFECTO real en el sistema de archivos.
  comando: sh
  argumentos: ["-c", "grep -q contenido-valido informe.txt && echo ANCLA_OK"]
  esperar_exit: 0
  esperar_salida: "ANCLA_OK"
  timeout: 30s

sandbox:
  tipo: cgroups
  memoria_mb: 256
  cpu_segundos: 30
  procesos: 32
  cgroups: auto
  timeout: 30s
  salida_max_kb: 64

llm:
  proveedor: openai
  modelo: simulado
  base_url: http://127.0.0.1:8210/v1
  max_tokens: 512
  temperature: 0.0
  timeout: 20s
  max_intentos: 1

final_action:
  # Se ejecuta SÓLO si el ancla da PASS.
  tipo: command
  comando: sh
  argumentos: ["-c", "echo 'validado por el ancla' > accion-final.txt"]

agent:
  max_reintentos: 2
  workspace_dir: /e2e/trabajo
  log_file: /e2e/registro.log
  log_level: debug
  log_consola: true
  graceful_shutdown_timeout: 10s
